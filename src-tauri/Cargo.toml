[package]
name = "rv-netshare"
version = "0.2.0"
description = "RV NetShare - LAN file transfer"
authors = ["you"]
edition = "2021"

[lib]
name = "rv_netshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
ngrok = { version = "0.19", default-features = false, features = ["ring"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Networking_WinSock"] }
webview2-com = "0.38"
windows-core = "0.61"
